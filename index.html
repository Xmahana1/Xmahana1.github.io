<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>José Enrique | Portafolio Data Analyst</title>

  <style>
    :root{
      --bg:#0b0d10; --card:#121622; --txt:#e9eef5; --muted:#a9b3c1;
      --acc:#7aa2ff; --border:#20283a; --soft:#0f1420;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:radial-gradient(1200px 700px at 20% 0%,#101a2d 0%,var(--bg) 60%);
      color:var(--txt);
    }
    a{color:var(--acc);text-decoration:none}
    .wrap{max-width:1100px;margin:0 auto;padding:28px}

    .hero{
      display:flex;gap:18px;align-items:center;flex-wrap:wrap;
      border:1px solid var(--border);border-radius:18px;padding:22px;
      background:linear-gradient(180deg,var(--card),var(--soft));
    }
    .avatar{
      width:92px;height:92px;border-radius:18px;background:#1b2333;
      display:grid;place-items:center;font-weight:800;color:#cfe0ff;
    }
    .btn{
      padding:10px 14px;border:1px solid var(--border);
      border-radius:12px;background:var(--soft);display:inline-block;
      margin:6px 6px 0 0;
    }
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:18px}
    .card{
      grid-column:span 12;background:var(--card);
      border:1px solid var(--border);border-radius:16px;padding:16px;
    }
    @media(min-width:900px){
      .half{grid-column:span 6}
      .proj{grid-column:span 6}
    }

    .projects{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
    .proj{
      grid-column:span 12;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .proj-body{padding:14px 16px}
    .proj-title{margin:0 0 8px 0;font-size:18px}
    .proj-desc{margin:0;color:var(--muted);line-height:1.45}
