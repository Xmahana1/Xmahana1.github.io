<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>José Enrique | Portafolio Data Analyst</title>
  <style>
    :root { --bg:#0b0d10; --card:#121622; --txt:#e9eef5; --muted:#a9b3c1; --acc:#7aa2ff; }
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--txt);}
    a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
    .wrap{max-width:980px;margin:0 auto;padding:28px}
    .hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:22px;border:1px solid #20283a;border-radius:16px;background:linear-gradient(180deg,#0f1420,transparent)}
    .avatar{width:96px;height:96px;border-radius:16px;background:#1b2333;display:grid;place-items:center;font-weight:700;color:var(--muted)}
    h1{margin:0;font-size:28px}
    .tag{color:var(--muted);margin-top:6px}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .btn{padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid #20283a}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:18px}
    .card{grid-column:span 12;background:var(--card);border:1px solid #20283a;border-radius:16px;padding:16px}
    @media(min-width:860px){ .card.half{grid-column:span 6} }
    .muted{color:var(--muted)}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .chip{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid #2a3550;color:var(--muted)}
    .proj{display:flex;flex-direction:column;gap:10px}
    .proj h3{margin:0;font-size:18px}
    .proj p{margin:0;color:var(--muted);line-height:1.45}
    .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .foot{margin-top:22px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">

    <section class="hero">
      <div class="avatar">JE</div>
      <div>
